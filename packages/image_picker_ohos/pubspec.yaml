name: image_picker_ohos
description: OHOS implementation using the current shared image picker interface.
version: 0.8.13+7
publish_to: none
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  image_picker_platform_interface: ^2.11.2
flutter:
  licenses:
    - LICENSE_ODID
    - LICENSE_HW
  plugin:
    implements: image_picker
    platforms:
      ohos:
        pluginClass: ImagePickerPlugin
        dartPluginClass: ImagePickerOhos
