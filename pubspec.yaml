dev_dependencies:
  flutter_test:
    sdk: flutter
  # Exercise the shared Cupertino implementation in the OHOS UI regression.
  cupertino_ui: ^1.1.6
  # Shared native-asset regression tooling (the same versions used by hooks).
  code_assets: ^2.2.0
  native_toolchain_c: ^0.19.6
  hooks: ^2.2.0
  # Exercise the registered OHOS backend through the current ImagePicker API.
  image_picker_ohos:
    path: packages/image_picker_ohos
  # Verify the shared Flutter menu renderer used by the OHOS plugin.
  super_native_extensions: ^0.9.1
  # flutter_image_compress is a federated plugin; the test registers the
  # macOS Dart implementation explicitly (the plugin registrant does not run
  # under flutter test), so the package must be a direct dependency.
  flutter_image_compress_macos: ^1.1.0

  # The websocket test channel implements StreamChannelMixin; stream_channel is
  # already present transitively via web_socket_channel.
  stream_channel: ^2.1.4

