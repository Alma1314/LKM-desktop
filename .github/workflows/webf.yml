name: Official mini apps

on:
  pull_request:
    paths:
      - "webf/**"
      - "assets/webf/**"
      - "lib/mini_apps/**"
      - "lib/starhope/**"
      - "lib/data/drift_store.dart"
      - "lib/data/database.drift_impl.dart"
      - "lib/route.dart"
      - "test/core/mini_app*"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/webf.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          package_json_file: webf/package.json
      - run: pnpm --dir webf install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir webf check
      - run: pnpm --dir webf test
      - run: pnpm --dir webf check:asset

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: node webf/test-browser.mjs
